name: Data Science
slug: data-science
description: Jupyter-based data analysis and ML workflows
python_version: "3.10+"
supported_managers:
  - uv
  - pip
  - poetry

vscode_settings:
  editor.formatOnSave: true
  "[python]":
    editor.defaultFormatter: "charliermarsh.ruff"
    editor.formatOnSave: true
    editor.codeActionsOnSave:
      source.organizeImports.ruff: "explicit"

vscode_extensions:
  - ms-python.python
  - ms-python.vscode-pylance
  - charliermarsh.ruff
  - ms-toolsai.jupyter
  - ms-toolsai.jupyter-keymap

dependencies:
  core:
    - "pandas>=2.2"
    - "numpy>=2.0"
    - "jupyter>=1.1"
    - "jupyterlab>=4.2"
    - "scikit-learn>=1.5"
    - "matplotlib>=3.9"
    - "seaborn>=0.13"
  dev:
    - "pytest>=8.0"
    - "ruff>=0.8"
    - "mypy>=1.13"
  optional:
    - "tensorflow>=2.18"
    - "torch>=2.5"
    - "plotly>=5.24"
    - "statsmodels>=0.14"
    - "scipy>=1.14"

tags:
  - data
  - jupyter
  - analysis
  - ml
  - science

docs_url: "https://jupyter.org"
