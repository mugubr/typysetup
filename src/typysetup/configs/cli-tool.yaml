name: CLI Tool
slug: cli-tool
description: Command-line applications using Typer/Click
python_version: "3.10+"
supported_managers:
  - uv
  - poetry
  - pip

vscode_settings:
  editor.formatOnSave: true
  "[python]":
    editor.defaultFormatter: "charliermarsh.ruff"
    editor.formatOnSave: true
    editor.codeActionsOnSave:
      source.organizeImports.ruff: "explicit"

vscode_extensions:
  - ms-python.python
  - ms-python.vscode-pylance
  - charliermarsh.ruff

dependencies:
  core:
    - "typer>=0.15"
    - "click>=8.1"
    - "rich>=13.9"
  dev:
    - "pytest>=8.0"
    - "pytest-cov>=5.0"
    - "ruff>=0.8"
    - "mypy>=1.13"
  optional:
    - "pydantic>=2.9"
    - "python-dotenv>=1.0"

tags:
  - cli
  - command
  - terminal
  - tooling

docs_url: "https://typer.tiangolo.com"
