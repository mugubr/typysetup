name: ML/AI
slug: ml-ai
description: Machine learning and AI model development
python_version: "3.10+"
supported_managers:
  - uv
  - pip
  - poetry

vscode_settings:
  editor.formatOnSave: true
  "[python]":
    editor.defaultFormatter: "charliermarsh.ruff"
    editor.formatOnSave: true
    editor.codeActionsOnSave:
      source.organizeImports.ruff: "explicit"

vscode_extensions:
  - ms-python.python
  - ms-python.vscode-pylance
  - charliermarsh.ruff
  - ms-toolsai.jupyter
  - ms-toolsai.jupyter-keymap

dependencies:
  core:
    - "tensorflow>=2.18"
    - "torch>=2.5"
    - "scikit-learn>=1.5"
    - "pandas>=2.2"
    - "numpy>=2.0"
    - "jupyter>=1.1"
  dev:
    - "pytest>=8.0"
    - "ruff>=0.8"
    - "mypy>=1.13"
  optional:
    - "transformers>=4.46"
    - "huggingface-hub>=0.26"
    - "matplotlib>=3.9"
    - "seaborn>=0.13"
    - "plotly>=5.24"
    - "notebook>=7.2"
    - "jupyterlab>=4.2"

tags:
  - ml
  - ai
  - deep-learning
  - nlp
  - data

docs_url: "https://www.tensorflow.org"
