[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "typysetup"
version = "2.2.0"
description = "Interactive Python environment setup CLI for VSCode"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Miguel Muniz", email = "miguimuniz@gmail.com"}
]
keywords = ["cli", "python", "setup", "venv", "vscode"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "typer>=0.15.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "rich>=13.9.0",
    "questionary>=2.1.0",
    "tomli-w>=1.1.0",
    "packaging>=24.0",
]

[project.urls]
Homepage = "https://github.com/mugubr/typysetup"
Documentation = "https://github.com/mugubr/typysetup/blob/master/README.md"
Repository = "https://github.com/mugubr/typysetup"
Issues = "https://github.com/mugubr/typysetup/issues"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "ruff>=0.15",
    "mypy>=2.0",
]
release = [
    "build>=1.2",
    "twine>=6.1",
]

[project.scripts]
typysetup = "typysetup.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
typysetup = ["configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=typysetup --cov-report=html --cov-report=term-missing --cov-fail-under=80"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]

[tool.coverage.run]
source_pkgs = ["typysetup"]
branch = true

[tool.coverage.paths]
source = ["src/typysetup", "*/site-packages/typysetup"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # Line too long (handled by black)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports
"tests/*" = ["F841"]  # Unused variables in tests

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = false
check_untyped_defs = true
ignore_missing_imports = true
