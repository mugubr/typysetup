name: Async/Real-time
slug: async-realtime
description: High-performance async and real-time applications
python_version: "3.10+"
supported_managers:
  - uv
  - poetry
  - pip

vscode_settings:
  editor.formatOnSave: true
  "[python]":
    editor.defaultFormatter: "charliermarsh.ruff"
    editor.formatOnSave: true
    editor.codeActionsOnSave:
      source.organizeImports.ruff: "explicit"

vscode_extensions:
  - ms-python.python
  - ms-python.vscode-pylance
  - charliermarsh.ruff

dependencies:
  core:
    - "aiohttp>=3.10"
    - "websockets>=13.0"
    - "starlette>=0.41"
    - "uvicorn[standard]>=0.32"
  dev:
    - "pytest>=8.0"
    - "pytest-asyncio>=0.24"
    - "pytest-cov>=5.0"
    - "ruff>=0.8"
    - "mypy>=1.13"
  optional:
    - "aiofiles>=24.1"
    - "redis>=5.0"
    - "sqlalchemy>=2.0"
    - "fastapi>=0.115"

tags:
  - async
  - realtime
  - websockets
  - performance
  - concurrent

docs_url: "https://docs.python.org/3/library/asyncio.html"
