name: FastAPI
slug: fastapi
description: Web API with FastAPI framework - async, modern, fast
python_version: "3.10+"
supported_managers:
  - uv
  - poetry
  - pip

vscode_settings:
  editor.formatOnSave: true
  "[python]":
    editor.defaultFormatter: "charliermarsh.ruff"
    editor.formatOnSave: true
    editor.codeActionsOnSave:
      source.organizeImports.ruff: "explicit"

vscode_extensions:
  - ms-python.python
  - ms-python.vscode-pylance
  - charliermarsh.ruff

vscode_launch_config:
  version: "0.2.0"
  configurations:
    - name: "Python: FastAPI"
      type: debugpy
      request: launch
      module: uvicorn
      args:
        - "main:app"
        - "--reload"
      jinja: true
      justMyCode: true

dependencies:
  core:
    - "fastapi>=0.115"
    - "uvicorn[standard]>=0.32"
    - "pydantic>=2.9"
    - "pydantic-settings>=2.6"
  dev:
    - "pytest>=8.0"
    - "pytest-cov>=5.0"
    - "pytest-asyncio>=0.24"
    - "ruff>=0.8"
    - "mypy>=1.13"
  optional:
    - "sqlalchemy>=2.0"
    - "alembic>=1.14"
    - "httpx>=0.27"
    - "redis>=5.0"
    - "pydantic-extra-types>=2.9"

tags:
  - web
  - api
  - async
  - rest
  - backend

docs_url: "https://fastapi.tiangolo.com"
