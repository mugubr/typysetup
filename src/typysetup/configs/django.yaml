name: Django
slug: django
description: Full-stack web framework with batteries included
python_version: "3.10+"
supported_managers:
  - uv
  - poetry
  - pip

vscode_settings:
  editor.formatOnSave: true
  "[python]":
    editor.defaultFormatter: "charliermarsh.ruff"
    editor.formatOnSave: true
    editor.codeActionsOnSave:
      source.organizeImports.ruff: "explicit"

vscode_extensions:
  - ms-python.python
  - ms-python.vscode-pylance
  - charliermarsh.ruff
  - batisteo.vscode-django

vscode_launch_config:
  version: "0.2.0"
  configurations:
    - name: "Python: Django"
      type: debugpy
      request: launch
      program: "${workspaceFolder}/manage.py"
      args:
        - "runserver"
      django: true
      jinja: true
      justMyCode: true

dependencies:
  core:
    - "Django>=5.2"
    - "djangorestframework>=3.16"
    - "python-dotenv>=1.0"
  dev:
    - "pytest>=8.0"
    - "pytest-django>=4.9"
    - "pytest-cov>=5.0"
    - "ruff>=0.8"
    - "mypy>=1.13"
  optional:
    - "psycopg[binary]>=3.2"
    - "gunicorn>=23.0"
    - "celery>=5.4"
    - "django-extensions>=3.2"

tags:
  - web
  - framework
  - orm
  - backend

docs_url: "https://docs.djangoproject.com"
